networks:
  grid:
    driver: bridge

x-node-common: &node-common
  shm_size: 2gb
  depends_on:
    - selenium-hub
  environment:
    - SE_EVENT_BUS_HOST=selenium-hub
    - SE_EVENT_BUS_PUBLISH_PORT=4442
    - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:5555/status"]
    interval: 30s
    timeout: 10s
    retries: 5
  extra_hosts:
    - "behat.test:host-gateway"
  networks:
    - grid
  restart: unless-stopped

x-video-common: &video-common
  image: selenium/video:${SELENIUM_VERSION:-4.41.0-20260222}
  profiles: [video]
  volumes:
    - ./videos:/videos
  networks:
    - grid
  restart: unless-stopped

services:
  selenium-hub:
    image: selenium/hub:${SELENIUM_VERSION:-4.41.0-20260222}
    container_name: selenium-hub
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - grid
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    restart: unless-stopped

  # arm64: set CHROME_IMAGE_NAME=selenium/node-chromium in .env
  chrome:
    <<: *node-common
    image: ${CHROME_IMAGE_NAME:-selenium/node-chrome}:${SELENIUM_VERSION:-4.41.0-20260222}
    ports:
      - "5900:5900"  # VNC Chrome

  firefox:
    <<: *node-common
    image: selenium/node-firefox:${SELENIUM_VERSION:-4.41.0-20260222}
    ports:
      - "5901:5900"  # VNC Firefox

  chrome_video:
    <<: *video-common
    depends_on:
      - chrome
    environment:
      - DISPLAY_CONTAINER_NAME=chrome
      - SE_NODE_GRID_URL=http://selenium-hub:4444
      - SE_VIDEO_FILE_NAME=auto
      - SE_RETAIN_ON_FAILURE=true

  firefox_video:
    <<: *video-common
    depends_on:
      - firefox
    environment:
      - DISPLAY_CONTAINER_NAME=firefox
      - SE_NODE_GRID_URL=http://selenium-hub:4444
      - SE_VIDEO_FILE_NAME=auto
      - SE_RETAIN_ON_FAILURE=true

  file_browser:
    image: filebrowser/filebrowser:latest
    profiles: [video]
    container_name: file_browser
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./videos:/srv
    environment:
      - FB_NOAUTH=true
    networks:
      - grid
